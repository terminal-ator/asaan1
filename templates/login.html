{{define "login.html"}}<!doctype html><html><head><title>Ordex Admin</title><script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script><style>body{font:15px system-ui;background:#f4f7f4;margin:0;display:grid;place-items:center;min-height:100vh;color:#17221e}main{width:min(360px,calc(100% - 40px));background:#fff;border:1px solid #e1e8e2;border-radius:14px;padding:25px}h1{color:#176b51;margin:0}.muted{color:#6d7a72;font-size:13px}.error{color:#b2402b;font-size:13px}label{display:grid;gap:7px;margin-top:20px;font-weight:700}input{padding:12px;border:1px solid #cfd9d1;border-radius:8px;font:inherit}button{width:100%;padding:12px;border:0;border-radius:8px;background:#176b51;color:#fff;font:inherit;font-weight:700;margin-top:18px}</style></head><body><main x-data="{show:false,loading:false}"><h1>Ordex Admin</h1><p class="muted">Sign in to manage orders and products.</p>{{if .Error}}<p class="error">Incorrect password.</p>{{end}}<form method="post" action="/admin/login" @submit="loading=true"><label>Password<input :type="show?'text':'password'" name="password" required autofocus></label><label><input type="checkbox" @change="show=$event.target.checked"> Show password</label><button :disabled="loading"><span x-text="loading?'Signing in…':'Sign in'"></span></button></form></main></body></html>{{end}}
