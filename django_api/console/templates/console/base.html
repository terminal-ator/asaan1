{% load static %}<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Ordex Console</title><script src="https://cdn.tailwindcss.com"></script><script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script><style>@media print{nav,.no-print{display:none!important}body{background:#fff!important}.slip-page{break-after:page;box-shadow:none!important;border:1px solid #cbd5e1!important}}@page{margin:12mm}[x-cloak]{display:none!important}</style></head><body class="min-h-screen bg-slate-50 text-slate-900"><nav class="bg-emerald-900 text-white"><div class="mx-auto flex max-w-7xl flex-wrap items-center gap-2 px-4 py-4 sm:px-6"><a class="mr-3 text-lg font-black" href="{% url 'console-dashboard' %}">Ordex <span class="font-normal text-emerald-300">Console</span></a><a class="rounded-lg bg-emerald-700 px-3 py-2 text-sm font-semibold" href="{% url 'console-sales-register' %}">Sales register</a><a class="rounded-lg px-3 py-2 text-sm font-semibold text-emerald-100 hover:bg-emerald-800" href="{% url 'console-purchase-list' %}">Purchases</a><a class="rounded-lg px-3 py-2 text-sm font-semibold text-emerald-100 hover:bg-emerald-800" href="{% url 'console-returns' %}">Returns</a><a class="rounded-lg px-3 py-2 text-sm font-semibold text-emerald-100 hover:bg-emerald-800" href="{% url 'console-inventory' %}">Inventory</a><a class="rounded-lg px-3 py-2 text-sm font-semibold text-emerald-100 hover:bg-emerald-800" href="{% url 'console-products' %}">Products</a><a class="rounded-lg px-3 py-2 text-sm font-semibold text-emerald-100 hover:bg-emerald-800" href="{% url 'console-shops' %}">Customers</a><a class="rounded-lg px-3 py-2 text-sm font-semibold text-emerald-100 hover:bg-emerald-800" href="{% url 'console-gst-report' %}">GST reports</a><span class="flex-1"></span><a class="text-sm text-emerald-200 hover:text-white" href="{% url 'console-invoice-settings' %}">Settings</a><div class="relative" x-data="{open: false}" @keydown.escape.window="open = false"><button type="button" class="rounded-lg px-3 py-2 text-xl leading-none text-emerald-100 hover:bg-emerald-800" aria-label="More options" @click="open = !open" :aria-expanded="open ? 'true' : 'false'">⋮</button><div x-show="open" x-cloak @click.outside="open = false" class="absolute right-0 z-50 mt-2 w-56 overflow-hidden rounded-xl bg-white py-1 text-slate-800 shadow-xl ring-1 ring-slate-200"><button type="button" class="block w-full px-4 py-2.5 text-left text-sm font-semibold hover:bg-slate-100" onclick="window.location.reload()">Refresh</button><button type="button" class="block w-full px-4 py-2.5 text-left text-sm font-semibold hover:bg-slate-100" onclick="ordexClearCache()">Clear cache &amp; reload</button><form method="post" action="{% url 'logout' %}">{% csrf_token %}<button class="block w-full px-4 py-2.5 text-left text-sm font-semibold text-rose-700 hover:bg-rose-50">Log out</button></form></div></div></div></nav>{% if messages %}<div class="mx-auto max-w-7xl px-4 pt-4 sm:px-6">{% for message in messages %}<div class="rounded-xl border border-emerald-200 bg-emerald-50 px-4 py-3 text-sm text-emerald-800">{{ message }}</div>{% endfor %}</div>{% endif %}{% block content %}{% endblock %}<script>async function ordexClearCache(){try{if("caches"in window){for(const key of await caches.keys())await caches.delete(key)}if("serviceWorker"in navigator){for(const registration of await navigator.serviceWorker.getRegistrations())await registration.unregister()}}finally{window.location.reload()}}</script></body></html>
