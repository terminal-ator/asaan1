{% load static %}<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Ordex Console</title><script src="https://cdn.tailwindcss.com"></script><script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script><style>@media print{nav,.no-print{display:none!important}body{background:#fff!important}.slip-page{break-after:page;box-shadow:none!important;border:1px solid #cbd5e1!important}}@page{margin:12mm}</style></head><body class="min-h-screen bg-slate-50 text-slate-900"><nav class="bg-emerald-900 text-white"><div class="mx-auto flex max-w-7xl flex-wrap items-center gap-2 px-4 py-4 sm:px-6"><a class="mr-3 text-lg font-black" href="{% url 'console-dashboard' %}">Ordex <span class="font-normal text-emerald-300">Console</span></a><a class="rounded-lg bg-emerald-700 px-3 py-2 text-sm font-semibold" href="{% url 'console-sales-register' %}">Sales register</a><a class="rounded-lg px-3 py-2 text-sm font-semibold text-emerald-100 hover:bg-emerald-800" href="{% url 'console-purchase-list' %}">Purchases</a><a class="rounded-lg px-3 py-2 text-sm font-semibold text-emerald-100 hover:bg-emerald-800" href="{% url 'console-returns' %}">Returns</a><a class="rounded-lg px-3 py-2 text-sm font-semibold text-emerald-100 hover:bg-emerald-800" href="{% url 'console-inventory' %}">Inventory</a><a class="rounded-lg px-3 py-2 text-sm font-semibold text-emerald-100 hover:bg-emerald-800" href="{% url 'console-products' %}">Products</a><a class="rounded-lg px-3 py-2 text-sm font-semibold text-emerald-100 hover:bg-emerald-800" href="{% url 'console-shops' %}">Customers</a><a class="rounded-lg px-3 py-2 text-sm font-semibold text-emerald-100 hover:bg-emerald-800" href="{% url 'console-gst-report' %}">GST reports</a><span class="flex-1"></span><a class="text-sm text-emerald-200 hover:text-white" href="{% url 'console-invoice-settings' %}">Settings</a></div></nav>{% if messages %}<div class="mx-auto max-w-7xl px-4 pt-4 sm:px-6">{% for message in messages %}<div class="rounded-xl border border-emerald-200 bg-emerald-50 px-4 py-3 text-sm text-emerald-800">{{ message }}</div>{% endfor %}</div>{% endif %}{% block content %}{% endblock %}</body></html>
