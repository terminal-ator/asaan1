<label class="block">
  <span class="mb-1.5 block text-sm font-semibold text-slate-700">
    {{ field.label }}{% if field.field.required %}<span class="text-rose-500"> *</span>{% endif %}
  </span>
  {{ field }}
  {% if field.help_text %}
  <span class="mt-1 block text-xs text-slate-400">{{ field.help_text }}</span>
  {% endif %}
  {% for error in field.errors %}
  <span class="mt-1 block text-xs text-rose-600">{{ error }}</span>
  {% endfor %}
</label>
