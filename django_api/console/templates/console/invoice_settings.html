{% extends 'console/base.html' %}

{% block content %}
<main class="mx-auto max-w-3xl px-4 py-6 sm:px-6 lg:py-8">
  <div class="mb-6"><p class="text-xs font-bold uppercase tracking-wider text-brand-600">Billing</p><h1 class="text-2xl font-extrabold tracking-tight sm:text-3xl">Invoice settings</h1><p class="mt-1 text-sm text-slate-500">These details appear as the seller on printed invoices.</p></div>
  <form class="space-y-4 rounded-2xl bg-white p-5 shadow-card ring-1 ring-slate-200/80 sm:p-7" method="post">
    {% csrf_token %}
    {% for field in form %}<label class="block"><span class="mb-1.5 block text-sm font-semibold text-slate-700">{{ field.label }}</span>{{ field }}{% for error in field.errors %}<span class="mt-1 block text-xs text-rose-600">{{ error }}</span>{% endfor %}</label>{% endfor %}
    <div class="flex justify-end border-t border-slate-100 pt-5"><button class="rounded-xl bg-brand-600 px-4 py-2.5 text-sm font-semibold text-white hover:bg-brand-700">Save invoice profile</button></div>
  </form>
</main>
{% endblock %}
