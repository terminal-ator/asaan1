{% extends "admin/base_site.html" %}
{% block content %}<h1>Import products</h1><p>Upload CSV columns: <code>sku,name,simple_name,company,brand,category,packing,unit,sale_rate,mrp,image_url,active</code>.</p><p>Rates are in rupees. Existing SKUs are updated; new SKUs are created.</p><form method="post" enctype="multipart/form-data">{% csrf_token %}<input type="file" name="file" accept=".csv,text/csv" required><input type="submit" value="Import" class="default"></form>{% endblock %}
