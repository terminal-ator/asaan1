server {
    listen 80;
    server_name orders.example.com;

    # Built PWA (npm run build writes here on the server)
    root /opt/ordex/dist;
    index index.html;

    client_max_body_size 5m;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # The shell and the service worker must always be revalidated.
    location = /index.html { add_header Cache-Control "no-cache"; }
    location = /sw.js { add_header Cache-Control "no-cache"; }
    location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; }

    location / {
        try_files $uri /index.html;
    }

    # Django API, console, admin and uploaded product images.
    location /api/ { proxy_pass http://127.0.0.1:8081; }
    location /console/ { proxy_pass http://127.0.0.1:8081; }
    location /admin/ { proxy_pass http://127.0.0.1:8081; }
    location /static/ { proxy_pass http://127.0.0.1:8081; }
    location /media/ { proxy_pass http://127.0.0.1:8081; }
}

# For HTTPS, obtain a certificate (for example with certbot) and add:
#   listen 443 ssl;
#   ssl_certificate     /etc/letsencrypt/live/orders.example.com/fullchain.pem;
#   ssl_certificate_key /etc/letsencrypt/live/orders.example.com/privkey.pem;
# Then set DJANGO_SECURE_COOKIES=true and keep DJANGO_CSRF_TRUSTED_ORIGINS in
# the service environment.
