# Ordex: serves the built PWA and proxies the Django API and console.
# Install as /etc/nginx/sites-available/ordex, then:
#   ln -s /etc/nginx/sites-available/ordex /etc/nginx/sites-enabled/ordex
#   nginx -t && systemctl reload nginx

server {
    listen 80;
    server_name orders.example.com;

    # The built PWA (npm run build writes here).
    root /opt/ordex/dist;
    index index.html;

    # Product photos come straight off a phone camera.
    client_max_body_size 12m;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Django runs on this port; it must match GUNICORN_PORT in /etc/ordex/ordex.env.
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # PWA shell must always revalidate so a deploy is picked up.
    location = /index.html { add_header Cache-Control "no-cache"; }
    location = /sw.js { add_header Cache-Control "no-cache"; }

    # Vite output is content-hashed, so it can be cached hard.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri /index.html;
    }

    # Django: API, console, admin, health, logout.
    location /api/ { proxy_pass http://127.0.0.1:8123; }
    location /console/ { proxy_pass http://127.0.0.1:8123; }
    location /admin/ { proxy_pass http://127.0.0.1:8123; }
    location = /logout/ { proxy_pass http://127.0.0.1:8123; }
    location = /healthz {
        proxy_pass http://127.0.0.1:8123;
        access_log off;
    }

    # collectstatic output and uploaded photos are served from disk, not Django.
    location /static/ {
        alias /opt/ordex/django_api/staticfiles/;
        access_log off;
        add_header Cache-Control "public, max-age=604800";
    }
    location /media/ {
        alias /var/lib/ordex/media/;
        access_log off;
        add_header Cache-Control "public, max-age=604800";
    }
}

# HTTPS: run `certbot --nginx -d orders.example.com` and it will add the 443
# server block and the redirect. After that, set in /etc/ordex/ordex.env:
#   DJANGO_SECURE_COOKIES=true
# and reload: systemctl restart ordex
